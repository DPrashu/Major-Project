<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Know Where You Stand ?</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #e3f2fd, #f0f8ff);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .form-wrapper {
      background: #ffffff;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      width: 400px;
      transition: all 0.3s ease;
    }

    h2 {
      text-align: center;
      margin-bottom: 24px;
      color: #0077b6;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 500;
      color: #333;
    }

    input[type="text"],
    input[type="email"],
    select {
      width: 100%;
      padding: 10px 14px;
      margin-bottom: 20px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 14px;
      transition: border-color 0.3s;
    }

    input:focus, select:focus {
      border-color: #0077b6;
      outline: none;
      box-shadow: 0 0 6px rgba(0, 119, 182, 0.2);
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background-color: #0077b6;
      color: #fff;
      font-size: 16px;
      cursor: pointer;
      transition: background-color 0.3s, transform 0.2s;
    }

    button:hover {
      background-color: #005f8d;
      transform: scale(1.02);
    }

    .error {
      color: red;
      font-size: 13px;
      margin-top: -15px;
      margin-bottom: 15px;
    }
  </style>
</head>
<body>

  <div class="form-wrapper">
    <h2>Know Where You Stand ?</h2>
    <form id="clusterForm" action="/process" method="POST">
      <label for="name">Name</label>
      <input type="text" id="name" name="name" placeholder="Enter your name" required />

      <label for="email">Email ID</label>
      <input type="email" id="email" name="email" placeholder="example@mail.com" required />

      <label for="candidate_id">Candidate ID</label>
      <input type="text" id="candidate_id" name="candidate_id" placeholder="Unique ID" required />

      <label for="job_role">Select Job Role</label>
      <select id="job_role" name="job_role" required>
        <option value="" disabled selected>Choose a role</option>
        <option value="Software Engineer">Software Engineer</option>
        <option value="Human Resource">Human Resource</option>
        <option value="AI/ML Engineer">AI/ML Engineer</option>
        <option value="DevOps Engineer">DevOps Engineer</option>
        <option value="Cyber Security Analyst">Cyber Security Analyst</option>
        <option value="Data Scientist">Data Scientist</option>
      </select>

      <div id="errorMsg" class="error"></div>
      <button type="submit">Get Cluster</button>
    </form>
  </div>

  <script>
    const form = document.getElementById('clusterForm');
    const errorMsg = document.getElementById('errorMsg');

    form.addEventListener('submit', function (e) {
      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const id = document.getElementById('candidate_id').value.trim();
      const job = document.getElementById('job_role').value;

      if (!name || !email || !id || !job) {
        e.preventDefault();
        errorMsg.textContent = "All fields are required!";
      } else {
        errorMsg.textContent = "";
      }
    });
  </script>
</body>
</html>
